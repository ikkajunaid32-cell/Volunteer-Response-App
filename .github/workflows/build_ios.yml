name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: volunteer_app
        run: flutter pub get

      - name: Build iOS App (.ipa)
        working-directory: volunteer_app
        run: |
          # Build unsigned IPA for testing/ad-hoc distribution
          flutter build ios --release --no-codesign
          
          # Package into .ipa
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r VolunteerResponse.ipa Payload
          cd ../../..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VolunteerResponse-iOS-IPA
          path: volunteer_app/build/ios/iphoneos/VolunteerResponse.ipa
          retention-days: 14
