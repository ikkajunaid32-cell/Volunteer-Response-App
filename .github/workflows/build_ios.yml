name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: volunteer_app
        run: flutter pub get

      - name: Build iOS App (.ipa)
        working-directory: volunteer_app
        shell: bash
        run: |
          flutter build ios --release --no-codesign 2>&1 | tee ios_build.log || {
            echo "::error::Flutter build iOS failed! Inspecting log tail:"
            tail -n 120 ios_build.log
            exit 1
          }

          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r VolunteerResponse.ipa Payload
          cd ../../..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VolunteerResponse-iOS.ipa
          path: volunteer_app/build/ios/iphoneos/VolunteerResponse.ipa
          retention-days: 14

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: volunteer_app/ios_build.log
